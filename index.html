<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#635bff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Classwork and Homework Planner">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<title>Homework Reminder</title>
</head>
<body>
<div class="app" id="app">
<header>
  <div><h1 id="pageTitle">Today</h1><div id="dateLine"></div></div>
</header>
<main id="main"></main>
<nav>
  <button data-page="today">⌂<br>Today</button>
  <button data-page="homework">✓<br>Homework</button>
  <button data-page="syllabus">◈<br>Syllabus</button>
  <button data-page="ai">✦<br>Gemini AI</button>
  <button data-page="settings">⚙<br>Settings</button>
</nav>
</div>
<div id="startupLoading" class="startupLoadingOverlay" style="display:grid"><div class="startupLoadingCard"><div class="stethoscopeSpinner">🩺</div><h2>Please wait</h2><p>Getting your login details…</p></div></div>
<div id="startupAuth" class="startupAuthOverlay" style="display:none">
  <div class="startupAuthCard glass">
    <div class="eyebrow">STUDENT LOGIN</div><h2>Homework Reminder</h2>
    <p class="mutedIntro">Enter all four details. Email and password must be authenticated by Firebase.</p>
    <label>Name</label><input id="startName" type="text" autocomplete="name" placeholder="Student name">
    <label>Roll number</label><input id="startRoll" type="number" min="1" max="100" inputmode="numeric" placeholder="Roll number (1–100)">
    <label>Email</label><input id="startEmail" type="email" autocomplete="email" placeholder="Student email">
    <label>Password</label><input id="startPassword" type="password" autocomplete="current-password" placeholder="Password (6+ characters)">
    <div class="twoCol"><button class="settingSave" id="startLogin">SIGN IN</button><button class="settingSave" id="startSignup">CREATE ACCOUNT</button></div>
    <button class="startupForgotLink" id="startForgot">Forgot password?</button>
    <p id="startAuthStatus" class="statusPill">Checking sign-in status…</p>
    <button class="startupAdminLink" id="startAdmin">Admin Login</button>
  </div>
</div>
<div id="toast" class="toast"></div>
<div id="confirmModal" class="modal"><div class="modalBox"><h3 id="confirmTitle">Confirm</h3><p id="confirmText"></p><div class="modalActions"><button class="no" id="confirmNo">CANCEL</button><button class="yes" id="confirmYes">CONFIRM</button></div></div></div>
<script type="module" src="app.js"></script>
</body>
</html>
