<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#635bff">
<meta name="description" content="Classwork and Homework Planner">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<title>Classwork Planner</title>
</head>
<body>
<div class="app" id="app">
<header>
  <div><h1 id="pageTitle">Today</h1><div id="dateLine"></div></div>
</header>
<main id="main"></main>
<nav>
  <button data-page="today">⌂<br>Today</button>
  <button data-page="homework">✓<br>Homework</button>
  <button data-page="syllabus">◈<br>Syllabus</button>
  <button data-page="ai">✦<br>Gemini AI</button>
  <button data-page="settings">⚙<br>Settings</button>
</nav>
</div>
<div id="toast" class="toast"></div>
<div id="confirmModal" class="modal"><div class="modalBox"><h3 id="confirmTitle">Confirm</h3><p id="confirmText"></p><div class="modalActions"><button class="no" id="confirmNo">CANCEL</button><button class="yes" id="confirmYes">CONFIRM</button></div></div></div>
<script src="app.js"></script>
</body>
</html>
